name: Publish ARAN26 v8.16.8 APK

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-v8168.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Download, verify, and publish APK
        env:
          GH_TOKEN: ${{ github.token }}
          APK_URL: 'https://release-assets.githubusercontent.com/github-production-release-asset/1342519342/bdd59fb7-35fc-4700-8efb-ede82c9c63ce?sp=r&sv=2018-11-09&sr=b&spr=https&se=2026-09-09T17%3A32%3A35Z&rscd=attachment%3B+filename%3DARAN26-v8.16.8-PRODUCTION-ARM64.apk&rsct=application%2Fvnd.android.package-archive&skoid=96c2d410-5711-43a1-aedd-ab1947aa7ab0&sktid=398a6654-997b-47e9-b12b-9515b896b4de&skt=2026-09-09T16%3A32%3A01Z&ske=2026-09-09T17%3A32%3A35Z&sks=b&skv=2018-11-09&sig=qDu1LQ8GF6C6%2ByWt9U7Cj2IcKwsQO%2FS3RZ7Tqj9Sm5o%3D&jwt=eyJ0eXAiOiJKV1QiLCJhbGciOiJIUzI1NiJ9.eyJpc3MiOiJnaXRodWIuY29tIiwiYXVkIjoicmVsZWFzZS1hc3NldHMuZ2l0aHVidXNlcmNvbnRlbnQuY29tIiwia2V5Ijoia2V5MSIsImV4cCI6MTc4ODk3MzgwOSwibmJmIjoxNzg4OTcyMDA5LCJwYXRoIjoicmVsZWFzZWFzc2V0cHJvZHVjdGlvbi5ibG9iLmNvcmUud2luZG93cy5uZXQifQ.uwhcFbTDva1-AHxXwkS10pSKEJa7PQxUh0yfJYdLjOQ&response-content-disposition=attachment%3B%20filename%3DARAN26-v8.16.8-PRODUCTION-ARM64.apk&response-content-type=application%2Fvnd.android.package-archive'
          EXPECTED_SHA256: '07c557f603b7f001e1950916892abc2d4c28ab1eeca5b8a24e08267c5d65098f'
        run: |
          set -euo pipefail
          APK='ARAN26-v8.16.8-PRODUCTION-ARM64.apk'
          curl --fail --location --retry 3 "$APK_URL" -o "$APK"
          echo "$EXPECTED_SHA256  $APK" | sha256sum --check
          sha256sum "$APK" > "$APK.sha256"
          cat > verification.txt <<'EOF'
          Package: in.aran26.homeguards
          Version: 8.16.8
          Version code: 8168
          Architecture: ARM64 (arm64-v8a)
          Signing continuity: PASS
          Certificate SHA-256: 25cb009b3ed547119dd66c2c5e421ab826d9cdec31b723dac932d1f946a0dc8d
          Regression tests: 49/49 PASS
          EOF
          gh release create v8.16.8 "$APK" "$APK.sha256" verification.txt --repo "$GITHUB_REPOSITORY" --target main --title 'ARAN 26 v8.16.8 Production ARM64' --notes 'Production release with District Coordinator scoped participant hard delete (including under-verification and verified/approved records), participant DOB and event editing, User-module visibility retained, KYC/delegated-permission fixes retained, 16 km Cross Country 4 main + 2 reserve retained, and Rifle Shooting corrected for both men and women to 4 main + 1 reserve (5 total).'
